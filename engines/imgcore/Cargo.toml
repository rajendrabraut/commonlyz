[package]
name = "imgcore"
version = "0.1.0"
edition = "2021"
description = "Image processing engine for Kamala (pure Rust: memory-safe decoding of untrusted uploads)"
license = "MIT"
publish = false

[dependencies]
# Pure-Rust codecs only: no C decoders, so a malicious file can't trigger memory corruption.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
color_quant = "1.1.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
