name: Kamala

# Kamala: builds the Rust and Python engines, installs LibreOffice, and runs every Kamala test against the
# real engines. FILES_REQUIRE_ENGINES=1 turns a missing engine into a failure instead of a skipped test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MODEL_URL: https://huggingface.co/jonathanst29/tinier-upscale-models/resolve/899dc1e4b22bbf1955c2f1739c085edc080cb366/realesr-general-x4v3.onnx
  MODEL_SHA256: 924ebad6532777303582d4ce7811849b88869231a3ae7093e0f21200249df8d5

jobs:
  kamala:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engines/imgcore/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engines/imgcore/Cargo.lock') }}

      - name: Build imgcore (Rust)
        working-directory: engines/imgcore
        run: |
          cargo test --release --locked
          cargo build --release --locked

      - name: Install docengine (Python, hash-pinned)
        run: |
          python -m venv .venv-docengine
          .venv-docengine/bin/pip install --require-hashes --no-deps -r engines/docengine/requirements.txt

      - name: Download upscale model (pinned SHA-256)
        run: |
          mkdir -p models
          curl -fsSL "$MODEL_URL" -o models/realesr-general-x4v3.onnx
          echo "$MODEL_SHA256  models/realesr-general-x4v3.onnx" | sha256sum -c -

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui fonts-dejavu-core
          soffice --version

      - name: Test
        env:
          FILES_REQUIRE_ENGINES: "1"
          FILES_IMGCORE: ${{ github.workspace }}/engines/imgcore/target/release/imgcore
          FILES_PYTHON: ${{ github.workspace }}/.venv-docengine/bin/python
          FILES_DOCENGINE: ${{ github.workspace }}/engines/docengine
          FILES_MODEL: ${{ github.workspace }}/models/realesr-general-x4v3.onnx
          FILES_SOFFICE: /usr/bin/soffice
        run: dotnet test tests/Kamala.Tests -c Release --logger "trx;LogFileName=kamala.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-test-results
          path: tests/Kamala.Tests/TestResults/*.trx
